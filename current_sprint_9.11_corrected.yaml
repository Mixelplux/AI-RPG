codex_task_routing:
- run: 1
  task_type: Setup / staging
  recommended_model: mini or lighter model with low reasoning
  instructions: Promote the four Sprint 9.11 numbered staging files into the canonical docs paths, confirm
    the Markdown, YAML, and JSON manifests materially agree, validate docs/current_sprint.json, confirm
    all four canonical files exist, delete only the temporary Sprint 9.11 staging files after successful
    promotion and validation, then stop. Do not implement sprint code.
- run: 2
  task_type: Bounded sprint implementation
  recommended_model: standard Codex with medium reasoning
  instructions: Perform Startup Review, implement only Sprint 9.11, add focused tests, run every documented
    official .venv verification command, report results, then stop. Do not perform closeout and do not
    begin Sprint 9.12.
- run: 3
  task_type: Closeout documentation
  recommended_model: mini or lighter model with low reasoning
  instructions: Only after implementation verification passes, update architecture documentation, add
    ADR-031, update the sprint log, mark all canonical Sprint 9.11 manifests complete, update the compact
    handoff, remove or update stale active-run wording as appropriate, validate docs/current_sprint.json,
    confirm Sprint 9.12 has not started, then stop. Do not add features.
- run: 4
  task_type: Debugging / architecture investigation if needed
  recommended_model: high reasoning only if a focused medium-reasoning pass cannot resolve the failure
  instructions: Use only for an unclear verification failure involving request copy safety, context-to-request
    sequencing, source invocation, output validation, or state isolation. Keep investigation within Sprint
    9.11 scope.
