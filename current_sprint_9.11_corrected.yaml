acceptance_criteria:
- A dedicated narration-request module exists.
- The narration-request packet has explicit schema and version metadata.
- The packet identifies preview mode explicitly.
- The packet identifies the expected narration-output schema and version without embedding provider-specific
  payloads.
- The packet contains stable machine-readable narration constraints rather than provider-specific system
  or user messages.
- The constraints preserve the rule that narration may describe but may not decide simulation truth.
- The constraints require prose-only candidate output.
- The constraints forbid state mutation, time advancement, history creation, and persistence claims.
- The request is built only from the existing narration context packet and fixed contract metadata.
- The request does not access world state directly.
- The request does not broaden narration context or add full durable history.
- The request builder does not mutate the supplied narration context.
- The request packet does not expose live mutable references from the supplied narration context.
- Returned request packets are copy-safe.
- Repeated construction from equivalent narration context produces equivalent request packets.
- The request builder validates required context shape or otherwise rejects malformed input deterministically.
- Malformed narration context cannot produce a source-visible request packet.
- The narration pipeline constructs a narration request after context construction and before candidate-source
  invocation.
- The candidate source receives the narration request packet rather than the raw narration context packet.
- The fixed candidate source remains deterministic.
- The fixed candidate source continues returning only the existing fixed sample prose.
- The fixed candidate source does not generate prose from player input, scene data, history, request constraints,
  or world state.
- The candidate returned by the source still passes through validate_narration_output_packet(...) before
  display.
- Request-construction failure fails closed with unsuccessful preview output and empty display text.
- Malformed request handling fails closed.
- Source exceptions, malformed source results, and invalid candidates continue to fail closed.
- Failure diagnostics remain bounded and do not copy raw unvalidated prose into display text.
- GameEngine.get_narration_preview(...) remains the gameplay-facing preview entry point.
- Existing CLI syntax narration preview <player input> remains supported.
- Existing CLI behavior for narration context and narration output remains supported.
- Normal gameplay output is not replaced or altered.
- Narration request construction and preview do not mutate world state.
- Narration request construction and preview do not advance time.
- Narration request construction and preview do not create history or alter existing history identifiers.
- Narration requests, source results, candidates, and preview text are not persisted.
- No AI model, external service, provider SDK, or network call is used.
- Existing narration context and narration output contracts remain materially unchanged.
- Existing history context, history query, identity, and save/load behavior remain unchanged.
- Documentation describes the bounded provider-neutral narration request boundary.
- ADR-031 is added during closeout.
- Sprint 9.11 is marked complete only after all documented verification passes.
- Sprint 9.12 is not started.
verification:
  primary_commands:
  - .\.venv\Scripts\python.exe test_narration_request.py
  - .\.venv\Scripts\python.exe test_narration_source.py
  - .\.venv\Scripts\python.exe test_narration_pipeline.py
  - .\.venv\Scripts\python.exe test_narration_output.py
  - .\.venv\Scripts\python.exe test_narration_context.py
  - .\.venv\Scripts\python.exe test_history_context.py
  - .\.venv\Scripts\python.exe test_history_query.py
  - .\.venv\Scripts\python.exe test_save_load.py
  startup_command: .\.venv\Scripts\python.exe play_game.py
  regression_commands:
  - .\.venv\Scripts\python.exe -m json.tool docs/current_sprint.json
  manual_or_scripted_steps:
  - Confirm narration context <player input> still works.
  - Confirm narration output still works.
  - Confirm narration preview <player input> still displays the validated fixed sample.
  - Repeat the same preview and confirm deterministic output.
  - Confirm preview does not alter time, history, scene state, or saved state.
  - Confirm normal gameplay output remains unchanged.
  - Run a scripted play_game.main() flow through narration preview and quit if supported.
  - Cover request copy safety, malformed context, malformed request, request-construction failure, source
    exception, malformed source result, and invalid candidate behavior automatically rather than adding
    player-facing failure commands.
  verification_results:
  - 'test_narration_request.py: passed'
  - 'test_narration_source.py: passed'
  - 'test_narration_pipeline.py: passed'
  - 'test_narration_output.py: passed'
  - 'test_narration_context.py: passed'
  - 'test_history_context.py: passed'
  - 'test_history_query.py: passed'
  - 'test_save_load.py: passed'
  - '-m json.tool docs/current_sprint.json: passed'
  - 'play_game.py: rendered the opening scene and then hit EOF in the non-interactive session'
  - 'scripted play_game.main() smoke: passed'
non_goals:
- Do not call an AI model.
- Do not add an external API, SDK, or network dependency.
- Do not add model-provider implementations, provider selection, a provider registry, or a plugin framework.
- Do not add API keys, secrets, environment-variable loading, or provider configuration.
- Do not add model-ready natural-language prompt templates, system messages, user messages, chat-completion
  payloads, or provider-specific serialization.
- Do not add tokenization, token budgets, context-window management, cost tracking, or model parameters.
- Do not generate prose from narration context or narration request data.
- Do not add retries, timeouts, streaming, asynchronous execution, fallback providers, or caching.
- Do not replace normal gameplay narration.
- Do not persist narration requests, source results, candidates, or output.
- Do not treat request metadata, source metadata, or prose as world truth.
- Do not create history or world-state mutations from narration.
- Do not add semantic hallucination detection or lore verification.
- Do not broaden narration context or pass full durable history to the request or source.
- Do not add a new player-facing narration request command unless required to satisfy an already documented
  repository convention discovered during Startup Review; report that need before expanding scope.
- Do not implement world evolution, pressures, rumors, actor knowledge, schedules, evidence, consequences,
  opportunities, quests, combat, inventory, conditions, or travel execution.
- Do not refactor unrelated systems.
- Do not begin Sprint 9.12.
