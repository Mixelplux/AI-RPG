sprint: '9.11'
status: complete
title: Deterministic Narration Request Packet Contract
goal: Introduce a deterministic, versioned, provider-neutral narration request packet between narration
  context construction and the untrusted narration candidate-source boundary. The request packet must
  remain read-only, copy-safe, preview-only, and limited to the existing bounded narration context plus
  explicit machine-readable narration constraints. It must not call an AI model or external service.
design_intent: Sprint 9.10 isolated candidate production behind an untrusted, fail-closed source boundary.
  Sprint 9.11 defines the exact deterministic input contract that a future provider-backed source may
  consume without receiving direct world-state access or provider-specific payloads. The pipeline builds
  the existing narration context, converts it into a versioned request packet, passes a copy-safe request
  to the fixed candidate source, validates the returned candidate through the existing narration output
  contract, and exposes display text only after successful validation. The fixed source continues returning
  only the existing sample prose and does not generate prose from the request.
architectural_decision:
  adr: ADR-031
  title: Narration Requests Are Bounded, Deterministic, and Provider-Neutral
  policy: Narration sources receive a versioned request packet rather than direct world-state access or
    an unrestricted narration context object. The request contains only a copy-safe snapshot of the already
    bounded narration context, preview-mode metadata, expected output-contract metadata, and stable machine-readable
    constraints. It contains no provider-specific message format, credentials, mutable references, or
    simulation authority. Request construction or validation failure must fail closed and must not affect
    normal deterministic gameplay.
