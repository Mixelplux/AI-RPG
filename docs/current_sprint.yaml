sprint: '7.4'
status: complete
title: Game Session Lifecycle
goal: Introduce a GameSession layer responsible for starting, loading, and resetting
  gameplay sessions while keeping GameEngine focused on runtime orchestration.
expected_files:
- engine/game_session.py
- engine/game_engine.py
- play_game.py
- docs/architecture.md
- docs/sprint_log.md
- docs/decisions.md
- docs/current_sprint.md
- docs/current_sprint.yaml
- docs/current_sprint.json
acceptance_criteria:
- GameSession is introduced as the owner of session lifecycle behavior.
- A new game session can be initialized through the session layer.
- A saved game session can be loaded through the session layer.
- A session reset or fresh-start path is supported.
- GameEngine delegates session lifecycle responsibility instead of owning all startup/load/reset
  behavior directly.
- play_game.py continues to interact with the engine-facing API rather than low-level
  persistence or session internals.
- Existing movement, interaction, save, and load behavior remains unchanged.
- No unrelated systems, features, or refactors are introduced.
verification:
  primary_command: .\.venv\Scripts\python.exe play_game.py
  manual_steps:
  - Start a new game.
  - Confirm the opening scene displays normally.
  - Move or interact to change state.
  - Save the game through the existing command flow.
  - Exit and restart the game.
  - Load the saved game through the existing command flow.
  - Confirm restored state matches the saved state.
  - Confirm normal gameplay commands still work after loading.
  - Confirm a fresh-start or reset path starts a clean session.
  codex_runtime_note: If Codex cannot launch the project virtual environment but the
    user successfully runs the documented verification command manually from PowerShell,
    Codex may use the reported manual result for sprint closeout. This only applies
    to tool/runtime execution failures, not application failures.
