        "Own a pure scope-applicability helper or equivalent domain operation.",
        "Validate the relevant pressure collection before filtering.",
        "Filter only by exact region and location scope.",
        "Construct copy-safe results in stable deterministic order.",
        "Remain unaware of scenes, narration, history, runtime effects, time, and player movement."
      ],
      "game_engine": [
        "Own the public gameplay facade.",
        "Resolve an omitted location_id from durable player location.",
        "Validate an explicit location_id against exact Region Pack location identifiers.",
        "Call the pressure-domain applicability operation.",
        "Return the copy-safe result without changing durable or derived runtime state."
      ],
      "forbidden_duplication": "Do not duplicate applicability interpretation in scene, perception, narration, event-specific, or command-specific code."
    },
