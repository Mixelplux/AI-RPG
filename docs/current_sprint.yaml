sprint: "9.7"
status: "complete"
title: "Narration Context Boundary"
goal: >-
  Create a deterministic, read-only narration context packet that combines
  player input, current scene state, current time, player location, and bounded
  history context for future AI-assisted narration. The packet must define what
  a future narrator is allowed to see without allowing narration to mutate world
  state, create history, advance time, summarize history, interpret events, or
  call an AI model.
design_intent: >-
  Sprint 9.7 introduces the first safe consumer-facing boundary for bounded
  history context: a narration context packet. This is not the narrator, not AI
  integration, and not world evolution. It is the deterministic input contract
  that future narration may use.
design_rule: >-
  The narrator can describe. The engine decides what is true. Narration context
  may support atmospheric prose, but future narration must not invent unstated
  specifics. The narrator may describe sensory conditions grounded in known
  scene facts, but must not invent player equipment, clothing, memories,
  emotions, physical conditions, owned items, NPC attitudes, relationships,
  hidden observers, threats, clues, exits, or durable world facts unless those
  details are present in the narration context.
