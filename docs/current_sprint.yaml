    "mode": "single-sprint",
    "status": "planned",
    "goal": "Add one canonical, deterministic, read-only, scope-aware operation for retrieving every persistent pressure applicable to one exact Region Pack location, defaulting to the player's current durable location when no location identifier is supplied.",
    "design_intent": "Sprint 10.6 establishes a reusable pressure-read boundary before any scene, perception, narration, visibility, activity, ranking, progression, or generic effect policy is introduced. Applicability means exact scope membership only.",
    "source_state": {
      "branch": "main",
      "commit": "eda236ac74eba329411fb728921d0bcdb292fd09",
      "predecessor_sprint": "10.5",
      "predecessor_status": "complete",
      "accepted_recommendation": "Sprint 10.6 should implement Read-Only Applicable Pressures for One Location."
    },
    "platform": {
      "operating_system": "Windows",
      "shell": "PowerShell",
      "official_interpreter": ".\\.venv\\Scripts\\python.exe"
    },
    "architectural_decision": {
      "adr": "ADR-040",
      "title": "Pressure Applicability Is a Pure Scope-Aware Read Boundary",
      "status_during_sprint": "proposed",
      "policy": "Pressure applicability is determined only by exact region and location scope. The canonical operation is deterministic, read-only, and copy-safe. Applicability does not imply activity, visibility, perceptibility, importance, narrative relevance, escalation eligibility, or any other policy. Future consumers must use this boundary rather than reimplementing scope filtering."
    },
    "public_api": {
      "preferred_signature": "GameEngine.get_applicable_pressures(location_id=None)",
      "naming_rule": "Adjust the exact name only if established repository conventions strongly require it.",
      "default_location_behavior": "When location_id is omitted, use the player's current durable location.",
      "explicit_location_behavior": [
        "Require a string.",
        "Require a non-empty value.",
        "Require an exact canonical location_id from the loaded Region Pack.",
        "Do not move the player or modify any state."
      ],
      "result_contract": [
        "Include every region-scoped pressure whose scope_id exactly equals the loaded Region Pack region_id.",
        "Include every location-scoped pressure whose scope_id exactly equals the requested location_id.",
        "Include pressures at every valid level, including level 0.",
        "Exclude pressures scoped to every other location.",
        "Return defensive copies.",
        "Use a stable deterministic ordering."
      ]
    },
    "applicability_semantics": {
      "means_only": "Exact scope membership for the requested region and location.",
      "does_not_imply": [
        "active",
        "visible",
        "perceptible",
        "important",
        "narratively relevant",
        "eligible for escalation"
      ],
      "forbidden_transformations": [
        "ranking",
        "thresholding",
        "summarization",
        "merging",
        "combining by pressure_type"
      ]
    },
    "ownership_boundary": {
