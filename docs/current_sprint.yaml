  platform:
    official_interpreter: .\.venv\Scripts\python.exe
  expected_files:
    likely_modified:
      - engine/game_engine.py
      - engine/interaction_kernel.py
      - play_game.py
      - test_discovery.py
      - docs/current_capability_package.md
      - docs/current_sprint.md
      - docs/current_sprint.yaml
      - docs/current_sprint.json
    likely_created: []
  acceptance_criteria:
    - Known discoveries project in authored declaration order using authored player-facing labels.
    - The ordinary recall command exposes no raw discovery, evidence, trace, causal, or lifecycle identifiers.
    - Unknown and legacy-empty discovery state remain safe and non-mutating.
  verification:
    focused_commands:
      - .\.venv\Scripts\python.exe test_discovery.py
    required_regressions:
      - Directly affected interaction and CLI regressions
    manifest_commands:
      - JSON/YAML/Markdown parse and deep comparison
      - git diff --check
    closeout_commands:
      - Focused milestone verification before checkpoint
  execution_phases:
    - id: player-safe-clue-recall
  governance:
    - 'Approved package: Authored Discovery Use and Thread Resolution.'
    - 'Exactly one active sprint: 10.31.'
